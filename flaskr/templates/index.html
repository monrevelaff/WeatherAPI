<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
</head>

<body>

    <main class="weather-page">

        <div class="weather-card">

            <!-- =========================
                 HEADER
            ========================== -->
            <header class="weather-header">

                <div class="date-info">
                    <p class="date" id="date">Current Date</p>
                    <p class="current-time" id="current-time">
                        Current Time
                    </p>
                </div>

            </header>


            <!-- =========================
                 MAIN WEATHER
            ========================== -->
            <section class="current-weather">

                <div class="weather-icon">
                    <i id="weather-icon" class="wi"></i>
                </div>

                <div class="condition-text" id="weather-condition">
                    Loading...
                </div>

                <div class="day-night" id="day-night">
                    —
                </div>

                <div class="temperature">
                    <span id="temperature">—</span>
                    <i class="wi wi-celsius"></i>
                </div>

                <div class="feels-like">
                    Feels like
                    <span id="apparent-temperature">—</span>
                    <i class="wi wi-celsius"></i>
                </div>

                <div class="location">
                    Seremban, Malaysia
                </div>

            </section>


            <!-- =========================
                 DAILY DETAILS
            ========================== -->
            <section class="details-card">

                <!-- Sunrise -->
                <div class="weather-detail">

                    <div class="detail-icon">
                        <i class="wi wi-sunrise"></i>
                    </div>

                    <div class="detail-info">
                        <span class="label">
                            Sunrise
                        </span>

                        <span class="value" id="sunrise">
                            No data available
                        </span>
                    </div>

                </div>


                <!-- Sunset -->
                <div class="weather-detail">

                    <div class="detail-icon">
                        <i class="wi wi-sunset"></i>
                    </div>

                    <div class="detail-info">
                        <span class="label">
                            Sunset
                        </span>

                        <span class="value" id="sunset">
                            No data available
                        </span>
                    </div>

                </div>


                <!-- Minimum temperature -->
                <div class="weather-detail">

                    <div class="detail-icon">
                        <i class="wi wi-direction-down"></i>
                    </div>

                    <div class="detail-info">
                        <span class="label">
                            Low
                        </span>

                        <span class="value">
                            <span id="min-temp">—</span>
                            <i class="wi wi-celsius"></i>
                        </span>
                    </div>

                </div>


                <!-- Maximum temperature -->
                <div class="weather-detail">

                    <div class="detail-icon">
                        <i class="wi wi-direction-up"></i>
                    </div>

                    <div class="detail-info">
                        <span class="label">
                            High
                        </span>

                        <span class="value">
                            <span id="max-temp">—</span>
                            <i class="wi wi-celsius"></i>
                        </span>
                    </div>

                </div>

            </section>


            <!-- =========================
                 TOMORROW / HOURLY
            ========================== -->
            <section class="tomorrow-card">

                <div class="tomorrow-header">
                    <h2>Tomorrow</h2>
                </div>

                <div class="hourly-preview">

                    <div class="hour">
                        <span class="hour-time">
                            <i class="wi wi-time-12"></i>
                            <span>12 AM</span>
                        </span>

                        <span class="hour-icon">
                            🌧️
                        </span>

                        <span class="hour-temp" id="hour-temp">
                            No data available
                        </span>
                    </div>


                    <div class="hour">
                        <span class="hour-time">
                            <i class="wi wi-time-3"></i>
                            <span>3 AM</span>
                        </span>

                        <span class="hour-icon">
                            🌧️
                        </span>

                        <span class="hour-temp">
                            No data available
                        </span>
                    </div>


                    <div class="hour">
                        <span class="hour-time">
                            <i class="wi wi-time-6"></i>
                            <span>6 AM</span>
                        </span>

                        <span class="hour-icon">
                            ☁️
                        </span>

                        <span class="hour-temp">
                            No data available
                        </span>
                    </div>


                    <div class="hour">
                        <span class="hour-time">
                            <i class="wi wi-time-9"></i>
                            <span>9 AM</span>
                        </span>

                        <span class="hour-icon">
                            🌤️
                        </span>

                        <span class="hour-temp">
                            No data available
                        </span>
                    </div>


                    <div class="hour">
                        <span class="hour-time">
                            <i class="wi wi-time-12"></i>
                            <span>12 PM</span>
                        </span>

                        <span class="hour-icon">
                            ☀️
                        </span>

                        <span class="hour-temp">
                            No data available
                        </span>
                    </div>

                </div>

            </section>

        </div>

    </main>


    <script src="{{ url_for('static', filename='index.js') }}"></script>

</body>

</html>
